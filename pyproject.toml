[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdt-anonymization"
version = "0.3.0"
description = "Legal-document reconstruction and entity-linking toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "transformers>=4.37,<5",
  "tokenizers>=0.15",
  "safetensors>=0.4",
]

[project.optional-dependencies]
efficient = [
  "accelerate>=0.26",
  "peft>=0.13",
  "bitsandbytes>=0.43",
]
hybrid = ["scikit-learn>=1.3"]
data = [
  "datasets>=2.19,<5",
  "pyarrow>=14.0",
  "huggingface_hub>=0.23",
]
training = ["tensorboard>=2.14"]
api = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "python-multipart>=0.0.9",
  "python-docx>=1.1,<2",
]

[project.scripts]
vdt = "vdt_anonymization.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vdt_anonymization = ["resources/dvhcvn/*", "review/*.html", "review/*.css", "review/*.js"]
